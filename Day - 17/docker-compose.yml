version: "3.9"

services:

  registry:

    image: registry:2

    container_name: docker-registry

    ports:
      - "5000:5000"

  jenkins:

    image: jenkins/jenkins:lts

    container_name: jenkins

    user: root

    privileged: true

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:

  jenkins_home:
