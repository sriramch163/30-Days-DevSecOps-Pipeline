version: "3.9"

services:

  nexus:

    image: sonatype/nexus3

    container_name: nexus

    ports:
      - "8081:8081"

    volumes:
      - nexus-data:/nexus-data

  jenkins:

    image: jenkins/jenkins:lts

    container_name: jenkins

    user: root

    privileged: true

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:

  nexus-data:

  jenkins_home:
